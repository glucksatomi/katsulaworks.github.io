<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#302f2e;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-weight:350}
header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(22px,5vw,80px);border-bottom:1px solid #eee;gap:20px}
.brand img{width:156px;max-width:35vw;display:block}.links{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.links a{font-size:11px;letter-spacing:.12em;text-decoration:none;color:#642e32}
main{max-width:760px;margin:0 auto;min-height:65vh;padding:100px 7vw 130px;text-align:center}
h1{font-family:Georgia,serif;font-weight:400;font-size:29px;letter-spacing:.12em;margin:0 0 48px}
p{font-size:13px;line-height:2.1;margin:0 0 25px}.en{display:none}body.english .ja{display:none}body.english .en{display:block}
.contact-button{display:inline-block;border:1px solid #642e32;background:#fff;color:#642e32;padding:13px 35px;font-size:12px;letter-spacing:.08em;cursor:pointer;margin-top:14px}
.contact-button:hover{background:#642e32;color:#fff}.language button{background:none;border:0;color:#777;cursor:pointer;font-size:11px;padding:5px}.language button[aria-pressed=true]{color:#642e32;font-weight:700}

@media(max-width:650px){header{padding:16px 6vw}.brand img{width:115px}.links{gap:12px}.links a{font-size:10px}main{padding:75px 7vw 100px}h1{font-size:25px}}
</style></head><body>
<header><a class="brand" href="/" aria-label="桂舎 KATSULA WORKS"><img src="katsula-official-logo.png" alt="桂舎 KATSULA WORKS"></a><nav class="links" aria-label="Main navigation"><a href="archive.html">ARCHIVE</a><a href="about.html">ABOUT</a><a href="contact.html" aria-current="page">CONTACT</a><span class="language"><button id="jp" aria-pressed="true" onclick="setLanguage(false)">JP</button><button id="en" aria-pressed="false" onclick="setLanguage(true)">EN</button></span></nav></header>
<main><h1>CONTACT</h1><p class="ja">作品の利用・ライセンス、展覧会や文化イベントの企画、その他のお問い合わせは<br>こちらからご連絡ください。</p><p class="en">For inquiries about artwork use and licensing, exhibitions, cultural events, or other matters, please get in touch.</p>
<button type="button" class="contact-button" onclick="openMail()"><span class="ja">メールで問い合わせる →</span><span class="en">SEND AN EMAIL →</span></button>
<noscript><p>お問い合わせにはJavaScriptを有効にしてください。 / Please enable JavaScript to contact us.</p></noscript>
</main><footer>© KATSULA WORKS. All rights reserved.</footer>
<script>
function setLanguage(english){document.body.classList.toggle('english',english);document.getElementById('jp').setAttribute('aria-pressed',String(!english));document.getElementById('en').setAttribute('aria-pressed',String(english));}
function openMail(){const name=String.fromCharCode(99,111,110,116,97,99,116);const domain=['katsula','works'].join('')+'.com';const subject=document.body.classList.contains('english')?'Inquiry to KATSULA WORKS':'桂舎へのお問い合わせ';window.location.href='mailto:'+name+'@'+domain+'?subject='+encodeURIComponent(subject);}
